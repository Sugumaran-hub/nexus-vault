<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Vault</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0A0A0C; color: #FFF; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-24 select-none">
  <!-- Top Bar -->
  <header class="p-4 flex items-center justify-between sticky top-0 bg-[#0A0A0C]/90 backdrop-blur-md z-30 border-b border-white/10">
    <div class="flex items-center gap-2">
      <span class="text-red-600 font-black text-2xl tracking-tighter">NEXUS</span>
      <span class="text-xs bg-red-600/20 text-red-400 px-2 py-0.5 rounded font-mono">VAULT</span>
    </div>
    <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">
      <i class="fa-solid fa-shield text-xs text-red-500"></i>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="px-4 py-3">
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-white/40 text-sm"></i>
      <input type="text" placeholder="Search Movies, Anime, Series, Tamil Dubs..." class="w-full bg-white/5 border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-red-500 transition">
    </div>
  </div>

  <!-- Hero Banner -->
  <div class="px-4 py-2">
    <div class="relative h-48 rounded-2xl overflow-hidden border border-white/10 flex items-end p-4 bg-gradient-to-t from-black via-black/40 to-transparent bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800');">
      <div>
        <span class="bg-red-600 text-[10px] font-bold px-2 py-0.5 rounded uppercase">Featured</span>
        <h2 class="text-lg font-bold mt-1">Universal Media Engine</h2>
        <p class="text-xs text-white/60">Stream in MX Player & Download with 1DM</p>
      </div>
    </div>
  </div>

  <!-- Content Sections -->
  <div class="px-4 mt-6">
    <h3 class="text-sm font-bold text-white/80 mb-3 flex items-center gap-2">
      <i class="fa-solid fa-fire text-red-500"></i> Tamil Dubbed & Popular
    </h3>
    <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
      <div class="min-w-[120px] rounded-xl overflow-hidden bg-white/5 border border-white/10">
        <div class="h-40 bg-zinc-800 flex items-center justify-center text-xs text-white/40">Poster 1</div>
        <div class="p-2 text-xs font-semibold truncate">Movie Title</div>
      </div>
      <div class="min-w-[120px] rounded-xl overflow-hidden bg-white/5 border border-white/10">
        <div class="h-40 bg-zinc-800 flex items-center justify-center text-xs text-white/40">Poster 2</div>
        <div class="p-2 text-xs font-semibold truncate">Anime Title</div>
      </div>
      <div class="min-w-[120px] rounded-xl overflow-hidden bg-white/5 border border-white/10">
        <div class="h-40 bg-zinc-800 flex items-center justify-center text-xs text-white/40">Poster 3</div>
        <div class="p-2 text-xs font-semibold truncate">Web Series</div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();
  </script>
</body>
        </html>
